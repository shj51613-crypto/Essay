
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3eb">
  <title>문장의 서랍</title>
  <style>
    :root {
      --paper: #f7f3eb;
      --card: #fffdf8;
      --ink: #443a30;
      --muted: #8b7d6c;
      --accent: #87694e;
      --line: #e6ddd0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", sans-serif;
    }
    header {
      padding: 25px 20px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    .wrap { width: min(760px, 100%); margin: auto; }
    .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: 2px; }
    h1 { font-size: 27px; margin: 8px 0; }
    .subtitle { color: var(--muted); font-size: 14px; }
    main { padding: 22px 16px 50px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    button {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 15px;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
    }
    button.active, .primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      margin-bottom: 16px;
    }
    h2 { font-size: 19px; margin: 0 0 14px; }
    h3 { font-size: 16px; margin: 0 0 7px; }
    label { display: block; font-size: 13px; margin: 12px 0 6px; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      padding: 12px;
      color: var(--ink);
      font: inherit;
    }
    textarea { min-height: 100px; resize: vertical; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .book, .quote {
      border-top: 1px solid var(--line);
      padding: 15px 0;
    }
    .book:first-child, .quote:first-child { border-top: 0; }
    .meta { color: var(--muted); font-size: 13px; margin: 5px 0; }
    .quote-text { line-height: 1.8; white-space: pre-wrap; }
    .reflection {
      background: var(--paper);
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .empty { color: var(--muted); text-align: center; padding: 22px 0; }
    .hidden { display: none; }
    .notice { color: var(--muted); font-size: 12px; line-height: 1.6; }
    @media (max-width: 480px) {
      .fields { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">MY READING JOURNAL</div>
    <h1>문장의 서랍</h1>
    <div class="subtitle">오래 간직하고 싶은 문장과 마음을 모으는 곳.</div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs">
    <button class="active" data-tab="books">나의 책장</button>
    <button data-tab="quotes">모아 둔 문장</button>
  </nav>

  <section id="books">
    <div class="panel">
      <h2>새로운 책 등록</h2>
      <form id="book-form">
        <label for="book-title">책 제목 *</label>
        <input id="book-title" required placeholder="예: 어서 오세요, 휴남동 서점입니다">
        <div class="fields">
          <div>
            <label for="book-author">저자</label>
            <input id="book-author" placeholder="저자 이름">
          </div>
          <div>
            <label for="book-isbn">ISBN (선택)</label>
            <input id="book-isbn" placeholder="ISBN">
          </div>
        </div>
        <label for="book-status">독서 상태</label>
        <select id="book-status">
          <option>읽고 싶은 책</option>
          <option>읽는 중</option>
          <option>완독</option>
        </select>
        <div class="actions">
          <button class="primary" type="submit">책장에 추가</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <h2>내 책장</h2>
      <div id="book-list"></div>
    </div>
  </section>

  <section id="quotes" class="hidden">
    <div class="panel">
      <h2>새로운 문장 기록</h2>
      <form id="quote-form">
        <label for="quote-book">어떤 책에서 발견했나요? *</label>
        <select id="quote-book" required></select>
        <label for="quote-text">책 속 문장 *</label>
        <textarea id="quote-text" required placeholder="마음에 남은 문장을 적어 보세요."></textarea>
        <label for="quote-reflection">나의 감상</label>
        <textarea id="quote-reflection" placeholder="이 문장을 읽고 어떤 생각이 들었나요?"></textarea>
        <div class="fields">
          <div>
            <label for="quote-section">목차 / 소제목</label>
            <input id="quote-section" placeholder="예: 1장 - 봄날">
          </div>
          <div>
            <label for="quote-page">쪽수</label>
            <input id="quote-page" type="number" min="1" placeholder="예: 35">
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="submit">문장 저장</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <h2>수집한 문장</h2>
      <div id="quote-list"></div>
    </div>
  </section>

  <p class="notice">현재 버전은 이 브라우저에 데이터를 저장하는 시제품입니다. 브라우저 데이터 삭제나 다른 기기에서는 데이터가 유지되지 않을 수 있어요. 계정 동기화 기능은 다음 단계에서 추가할 예정입니다.</p>
</main>

<script>
  const $ = id => document.getElementById(id);
  const load = (key) => {
    try { return JSON.parse(localStorage.getItem(key) || "[]"); }
    catch { return []; }
  };
  let books = load("munjang-books");
  let quotes = load("munjang-quotes");
  const save = () => {
    localStorage.setItem("munjang-books", JSON.stringify(books));
    localStorage.setItem("munjang-quotes", JSON.stringify(quotes));
  };
  const safe = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
  const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function render() {
    $("book-list").innerHTML = books.length ? books.map(b => `
      <div class="book">
        <h3>${safe(b.title)}</h3>
        <div class="meta">${safe(b.author || "저자 미입력")} · ${safe(b.status)}</div>
        <div class="meta">${quotes.filter(q => q.bookId === b.id).length}개의 문장</div>
        <div class="actions">
          <button data-write="${b.id}">이 책의 문장 기록</button>
          <button data-delete-book="${b.id}">책 삭제</button>
        </div>
      </div>`).join("") : '<div class="empty">아직 등록한 책이 없어요.</div>';

    $("quote-book").innerHTML = books.length
      ? books.map(b => `<option value="${b.id}">${safe(b.title)}</option>`).join("")
      : '<option value="">먼저 책을 등록해 주세요.</option>';

    $("quote-list").innerHTML = quotes.length ? [...quotes].reverse().map(q => {
      const book = books.find(b => b.id === q.bookId);
      return `<div class="quote">
        <div class="meta">${safe(book?.title || "삭제된 책")} · ${q.page ? safe(q.page) + "쪽" : "쪽수 미입력"}</div>
        <div class="quote-text">“${safe(q.text)}”</div>
        ${q.section ? `<div class="meta">목차: ${safe(q.section)}</div>` : ""}
        ${q.reflection ? `<div class="reflection">${safe(q.reflection)}</div>` : ""}
        <div class="actions">
          <button data-edit-quote="${q.id}">수정</button>
          <button data-delete-quote="${q.id}">삭제</button>
        </div>
      </div>`;
    }).join("") : '<div class="empty">아직 모은 문장이 없어요.</div>';
  }

  document.querySelectorAll("[data-tab]").forEach(button => {
    button.addEventListener("click", () => {
      document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("active", b === button));
      $("books").classList.toggle("hidden", button.dataset.tab !== "books");
      $("quotes").classList.toggle("hidden", button.dataset.tab !== "quotes");
    });
  });

  $("book-form").addEventListener("submit", event => {
    event.preventDefault();
    books.push({
      id: id(),
      title: $("book-title").value.trim(),
      author: $("book-author").value.trim(),
      isbn: $("book-isbn").value.trim(),
      status: $("book-status").value
    });
    save();
    event.target.reset();
    render();
  });

  $("quote-form").addEventListener("submit", event => {
    event.preventDefault();
    const bookId = $("quote-book").value;
    if (!books.some(b => b.id === bookId)) {
      alert("먼저 책을 등록해 주세요.");
      return;
    }
    quotes.push({
      id: id(), bookId,
      text: $("quote-text").value.trim(),
      reflection: $("quote-reflection").value.trim(),
      section: $("quote-section").value.trim(),
      page: $("quote-page").value.trim()
    });
    save();
    event.target.reset();
    render();
    alert("문장을 저장했어요.");
  });

  document.addEventListener("click", event => {
    const target = event.target;
    if (target.dataset.write) {
      $("quote-book").value = target.dataset.write;
      document.querySelector('[data-tab="quotes"]').click();
      $("quote-text").focus();
    }
    if (target.dataset.deleteBook) {
      const book = books.find(b => b.id === target.dataset.deleteBook);
      if (book && confirm(`'${book.title}' 책과 관련 문장을 삭제할까요?`)) {
        books = books.filter(b => b.id !== book.id);
        quotes = quotes.filter(q => q.bookId !== book.id);
        save(); render();
      }
    }
    if (target.dataset.deleteQuote) {
      if (confirm("이 문장을 삭제할까요?")) {
        quotes = quotes.filter(q => q.id !== target.dataset.deleteQuote);
        save(); render();
      }
    }
    if (target.dataset.editQuote) {
      const q = quotes.find(item => item.id === target.dataset.editQuote);
      if (!q) return;
      const text = prompt("문장 수정", q.text);
      if (text === null) return;
      const reflection = prompt("나의 감상 수정", q.reflection);
      if (reflection === null) return;
      q.text = text.trim();
      q.reflection = reflection.trim();
      save(); render();
    }
  });

  render();
</script>
</body>
</html>
